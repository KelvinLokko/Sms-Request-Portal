x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL}
  DB_CONNECTION: pgsql
  DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_SSLMODE: ${DB_SSLMODE:-prefer}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-r2}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: sms-client-portal-app:latest
    container_name: sms-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PHP_FPM_PORT:-9000}:9000"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sms

  horizon:
    image: sms-client-portal-app:latest
    container_name: sms-horizon
    restart: unless-stopped
    command: php artisan horizon
    env_file:
      - .env
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - sms

  scheduler:
    image: sms-client-portal-app:latest
    container_name: sms-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
    networks:
      - sms

  redis:
    image: redis:7-alpine
    container_name: sms-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sms

volumes:
  redis_data:
  app_storage:

networks:
  sms:
    driver: bridge
