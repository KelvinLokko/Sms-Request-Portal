# Host nginx. The application (nginx + php-fpm) runs in Docker, so the host
# only reverse proxies to the "web" container published on the loopback
# interface. Static assets are served by that container from the image build,
# so no project files are needed on the host.
server {
    listen 80;
    server_name sms.example.com;

    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Laravel trusts these to build https:// URLs behind the proxy.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
